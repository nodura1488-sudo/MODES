[package]
name = "tdev-launcher"
version = "0.2.0"
edition = "2021"
description = "TDEV Launcher — майнкрафт-лаунчер с режимами и аккаунтами Ely.by, полностью на Rust"
authors = ["TDEV"]
license = "MIT"

[dependencies]
eframe = { version = "0.37", default-features = false, features = ["glow", "default_fonts"] }
egui = "0.37"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp"] }
reqwest = { version = "0.13", features = ["blocking", "json", "rustls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
sha1 = "0.11"
md-5 = "0.10"
uuid = { version = "1", features = ["v4"] }
base64 = "0.22"
zip = "2.4"
walkdir = "2"
rfd = "0.17"
open = "5"
dirs = "6"
url = "2"
mc-launcher-core = "0.1.2"

[profile.release]
opt-level = 2
lto = "thin"
codegen-units = 1
strip = true
